<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 210 65" width="100%" height="100%">
  <!-- Ícone (Servidores + Linha de Monitoramento) -->
  <g transform="translate(5, 5)">
    <!-- Blocos de Servidores (Nós) -->
    <rect x="0" y="5" width="35" height="12" rx="3" fill="#3b82f6"/>
    <rect x="0" y="22" width="35" height="12" rx="3" fill="#1f3324" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="39" width="35" height="12" rx="3" fill="#1f3324" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- LEDs de status -->
    <circle cx="8" cy="11" r="2" fill="#00e676"/>
    <circle cx="8" cy="28" r="2" fill="#00e676"/>
    <circle cx="8" cy="45" r="2" fill="#00e676"/>
    
    <!-- Gráfico de pulso/performance -->
    <path d="M 12 35 Q 25 15 42 25 T 65 12" fill="none" stroke="#00e676" stroke-width="3" stroke-linecap="round"/>
    <circle cx="65" cy="12" r="3.5" fill="#00e676"/>
  </g>
  
  <!-- Texto: NutMetrics -->
  <text x="85" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#ffffff">NUT<tspan fill="#00e676">METRICS</tspan></text>
  <text x="87" y="56" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="2.5">INFRA MONITOR</text>
</svg>
